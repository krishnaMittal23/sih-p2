# NTRO Enterprise Platform — TLS & Cipher Configuration
# Infrastructure Layer: Load Balancers, API Gateways, Message Brokers
# ⚠️ ECDAT Demo Target: Config-level cryptographic asset detection

server:
  tls:
    min_version: "TLSv1"
    max_version: "TLSv1.2"
    cipher_suites:
      - "TLS_RSA_WITH_3DES_EDE_CBC_SHA"
      - "TLS_RSA_WITH_AES_128_CBC_SHA"
      - "TLS_RSA_WITH_RC4_128_MD5"
      - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
    certificate:
      key_algorithm: "RSA"
      key_size: 2048
      signature_algorithm: "SHA1withRSA"
      renewal_days: 365

# API Gateway Downstream mTLS Config
gateway:
  mutual_tls:
    enabled: true
    ssl_protocols: TLSv1.2
    verify_client: true
  hmac:
    algorithm: "MD5"
    secret_rotation_days: 90

# Legacy Message Broker (SWIFT Interface)
broker:
  encryption:
    algorithm: "3DES"
    mode: "CBC"
    key_size: 112
  auth:
    hash_algorithm: "SHA-1"
    signing_key_type: "RSA"
    signing_key_bits: 2048

# Database Encryption at Rest
database:
  at_rest_encryption:
    algorithm: "AES-256"
    mode: "GCM"
    key_management: "AWS-KMS"
  connection:
    ssl_mode: "verify-full"
    ssl_protocols: TLSv1.2
